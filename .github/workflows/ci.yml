name: Prototype tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          node --check src/app.mjs
          node --check src/research-ui.mjs
          node --check src/bodymap.mjs
          node --check src/research.mjs
          node --check src/dcs-screen.mjs
          node --check src/mission-mental.mjs
          node --check src/mission-mental-ui.mjs
          node --check src/cardiovascular.mjs
          node --check src/cardiovascular-ui.mjs
          node --check src/mission-demo.mjs
          node --check src/mission-demo-ui.mjs
          node --check src/offline-ui.mjs
          node --check sw.js
      - name: Run all unit tests
        run: node --test
