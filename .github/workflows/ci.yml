name: Prototype tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rule-engine unit tests
        run: node --test tests/engine.test.mjs
