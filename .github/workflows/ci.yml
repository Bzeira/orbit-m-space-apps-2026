name: EVA demo tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-eva:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current browser modules and service worker syntax
        run: |
          node --check src/eva-flow.mjs
          node --check src/eva-critical.mjs
          node --check sw.js
      - name: Run EVA tests
        run: node --test
