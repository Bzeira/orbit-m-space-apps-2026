<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101e">
  <meta name="description" content="ORBIT-M interactive astronaut EVA readiness demonstrator. All records and outcomes are simulated.">
  <title>ORBIT-M | EVA Assessment Demo</title>
  <link rel="stylesheet" href="./assets/eva-flow.css?v=20261115-eva-review-v6">
  <style>html,body{margin:0;min-height:100%;background:#10101e}noscript{display:block;padding:30px;color:white;font:16px Arial,sans-serif}</style>
</head>
<body>
  <noscript>Please enable JavaScript to run the ORBIT-M EVA demonstration.</noscript>
  <script type="module" src="./src/eva-flow.mjs?v=20261115-eva-review-v6"></script>
  <script>
    // Retire legacy offline workers that could display removed dashboard code.
    // Do not cache this app again: online requests should load the latest build.
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const appPath = new URL("./", location.href).pathname;
          await Promise.all(registrations
            .filter(reg => new URL(reg.scope).pathname === appPath)
            .map(reg => reg.unregister()));
        }
        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names
            .filter(name => name.startsWith("orbit-m-static-") || name.startsWith("orbit-m-eva-"))
            .map(name => caches.delete(name)));
        }
      } catch (_) {
        // Cache APIs are optional. The current EVA demo works without them.
      }
    })();
  </script>
</body>
</html>
